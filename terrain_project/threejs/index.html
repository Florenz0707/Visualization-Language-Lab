<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <title>Terrain Viewer — Three.js (改进版)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <style>
    html,
    body {
      height: 100%;
      margin: 0
    }

    #container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden
    }

    #ui {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 5;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px;
      border-radius: 8px;
      font-family: Segoe UI, Helvetica, Arial;
      font-size: 13px
    }

    #layer-list {
      max-height: 260px;
      overflow: auto;
      margin-top: 8px
    }

    label {
      display: block;
      margin: 4px 0
    }

    #loading {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border-radius: 6px;
      z-index: 6
    }

    button,
    select,
    input {
      font-size: 13px
    }
  </style>
</head>

<body>
  <div id="container"></div>

  <div id="ui">
    <strong>三维地形（Three.js）</strong>
    <div style="margin-top:8px">
      分辨率：<select id="segSelect">
        <option>128</option>
        <option selected>256</option>
        <option>384</option>
      </select>
      &nbsp;（顶点越多越细但越占内存）
    </div>
    <div style="margin-top:6px">
      垂直放大 (z scale): <input id="zscale" type="range" min="1" max="2000" value="150" step="1" />
      <span id="zval">150</span>
    </div>
    <div style="margin-top:8px"><strong>图层</strong></div>
    <div id="layer-list"></div>
    <div style="margin-top:8px">
      <button id="rebuild">重建地形</button>
      <button id="reset">重置视角</button>
    </div>
    <div style="margin-top:8px;font-size:12px;color:#444">
      提示：若无地形或页面卡，先把分辨率设为 128 并减小 z scale。
    </div>
  </div>

  <div id="loading">加载中…</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
  <script src="main.js"></script>
</body>

</html>
