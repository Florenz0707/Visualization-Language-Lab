# LLM Configuration
# 大模型服务配置文件

# 默认使用的模型
default_model: "qwen-max"

# 模型配置
models:
  # 通义千问 Max 模型
  qwen-max:
    enabled: true
    provider: "dashscope"
    model_name: "qwen-max"
    temperature: 0.7
    max_tokens: 2000
    top_p: 0.9

  # 通义千问 Plus 模型
  qwen-plus:
    enabled: true
    provider: "dashscope"
    model_name: "qwen-plus"
    temperature: 0.7
    max_tokens: 2000
    top_p: 0.9

  # DeepSeek Chat 模型 (直连 DeepSeek API)
  deepseek-chat:
    enabled: true
    provider: "deepseek"
    model_name: "deepseek-chat"
    temperature: 0.7
    max_tokens: 2000
    top_p: 0.9

# 全局设置
settings:
  # API 超时时间（秒）
  timeout: 60
  # 最大重试次数
  max_retries: 3
  # 重试延迟（秒）
  retry_delay: 2
  # 是否启用流式响应
  stream: true
